- id: D-V2-17
  what: E(T), poisson(T), alpha(T) from [63] all stop at 871-927 C, but the model runs to the solidus (1290 C)
  paper_says: "nothing -- Balbaa does not state how he treated the mechanical properties above the datasheet range"
  status: resolved
  adopted: "OPTION (c) -- E(T) collapses toward the solidus onto a finite floor. Parameters FROZEN at floor-frac = 0.01 (1 % of E(RT) = 1.71 GPa) and collapse onset = 0.8*T_solidus = 1250.52 K, i.e. the centre point of sweep A. Decision: yuyao 2026-08-06, convention set jointly with main-line D-11; bracket width is registry content, NOT an adoption precondition. Implementation: model/adopt_option_c.py points v2_material_config.json at tables/E_collapse.csv and tables/flow_curve_adopted.csv. The adopted E table is BYTE-IDENTICAL to the swept centre-point table and the adopted flow curve is value-identical to the swept centre arm at all 156 grid points -- what is adopted is exactly what was measured, not a re-derivation."
  bracket_registered: "sweep A, 5 members, all COMPLETE at 240+40 steps with zero Newton non-convergences (runs/v_sweepA.sh). Envelope over ALL TEN member pairs, top-layer 10000 in-part cells, absolute and relative: von Mises <= 6.34 % / 2.54 MPa; max principal <= 4.91 % / 1.99 MPa; sigma_xx <= 4.75 % / 1.89 MPa; sigma_yy <= 13.43 % / 1.04 MPa; sigma_zz <= 30.49 % / 2.02 MPa; eqp <= 45.92 % / 8.2e-4. Field RMS for scale: ~39-40 MPa on the primary components. The sigma_yy / sigma_zz and eqp relative figures are small-denominator inflation -- their absolute spread is at or below 2 MPa and 1e-3 respectively."
  bracket_must_be_combined: "the registered uncertainty is the COMBINATION of the D-V2-22 curve-reading bracket (offset vs cap, 2-3 %) and this parameter bracket, not this one alone."
  preregistered_criterion_failed: "STATED EXPLICITLY because the pre-registration exists to be honoured when it fails, not only when it passes. The pre-registered decision rule was: RS change within the 2-3 % offset-vs-cap bracket => component (a) dominates. Measured worst single-member-vs-centre figures are 5.41 % and 5.25 %, about 1.8x that threshold, so the rule as written lands in its 'sensitive' branch and does NOT license the adoption argument. The rule was superseded, not met. Grounds for superseding it: 2-3 % was borrowed from a CURVE-CHOICE sensitivity and there is no principle requiring a PARAMETER sensitivity to fit inside it; the substantive argument is instead that a 4x span in floor and +-0.1*T_sol in onset move the primary components by <= 2.54 MPa absolute against a ~40 MPa field."
  open_gap_no_xrd_number: "the supporting claim 'far below the XRD comparison uncertainty' is still UNQUANTIFIED -- no MPa figure for the IET-9 XRD read-off uncertainty has been recorded. Until that number exists the absolute-magnitude argument rests on an unstated comparison. Flagged by Kimi 2026-08-06; not a blocker for the adoption yuyao took, but it must be filled before the RS gate leans on it."
  monotonicity_measured_not_bounded: "Kimi's concern that reporting only member-vs-centre understates the full span was checked directly rather than bounded. Axis end-to-end, measured: floor 0.005->0.02 gives von Mises 4.97 %, onset 0.7->0.9 gives 4.91 %. The triangle-inequality worst case (sum of the two half-spans, ~9 %) does NOT materialise: the end-to-end over sum-of-halves ratio is 0.47-0.66, so the member differences partly cancel rather than add. The envelope maximum (6.34 %) sits on a DIAGONAL pair (f0005_c08 vs f001_c09, low floor x late onset), above either axis end-to-end -- so floor x onset interaction is real and measurable, and the steepest direction is low-floor + late-onset rather than the early-onset diagonal that intuition suggested."
  open_gap_corners_not_run: "the 5-point star cannot close the interaction envelope. All four corners (f0005_c07, f0005_c09, f002_c07, f002_c09) are GENERATED and preflighted but NOT RUN; runner runs/v_sweepA_corners.sh, default pair f0005_c09 / f002_c07 (the diagonal the evidence points at), ~70 min. Until they run, the registered envelope assumes the response is adequately sampled by the star; that assumption is registered here rather than left implicit."
  onset_axis_caveat: "the collapse-onset axis is not a pure onset change at its low end. At collapse-frac 0.7 the onset T_c = 1094.20 K falls inside the datasheet range, so the generator drops the 1144.15 K measured row (correct post-fix semantics: rows above T_c are on the collapse ramp and no longer describe the material). The onset sensitivity therefore mixes in the effect of discarding the highest-temperature measured point."
  top_layer_selection_verified: "the harvest selects the top 10000 cells by array position; that this really is the in-part top layer was previously assumed and is now MEASURED (compare_sweepA.py::verify_top_selection): selected cells have centroid z >= 4.2e-4 m against 3.0e-4 m for the rest, a 1.2e-4 m gap = 3 layer thicknesses. Assumption closed."
  eqp_downstream_warning: "the eqp bracket is <= 45.92 % relative but only <= 8.2e-4 absolute -- small-denominator inflation. Recorded separately because any downstream criterion keyed on eqp (ductility, damage) cannot treat that relative figure as negligible the way the stress components can."
  adoption_gate_outstanding: "graded-mesh convergence is demonstrated only as 'past the point where frac=0.01 died deterministically' (ledger 101 at the 2400 s cap, zero non-convergences), not as a completed 240+40 step run. runs/v_graded_gate.sh runs the adopted convention on graded with no timeout, ~2.5-3 h. Kimi's requested gate; prepared, not run."
  escalation_2026_08_04: "ESCALATE -- no longer a tidy-up item. This is the root cause that D-V2-19-R1 regularizes around, and the P0 sweep supplies exactly the evidence Fable5 set as the escalation trigger. The trigger: if a bounded minimum-tangent threshold stabilizes the finer meshes, R1 holds and D-V2-17 can wait for the main line; if the threshold keeps climbing with refinement, the regularizer is not containing the root cause and D-V2-17 must be raised. Measured: frac=0.01 fails on graded, frac=0.02 is required, and buying that convergence costs a 36 % (offset) / 45 % (cap) edit to the 1423 K flow stress at the strain the graded run actually reaches, plus a visible shift at room temperature. Paying in real sub-solidus material to keep a finer mesh solvable is the definition of the regularizer not containing the root cause."
  option_c_validated_2026_08_04: "TESTED, NOT YET ADOPTED -- adoption still needs the joint call with main-line D-11. Implementation: model/make_e_collapse.py emits tables/E_collapse.csv. Sheet rows (<=1144.15 K) byte-unchanged from [63]; the sheet's own end slope is extended to T_c = 0.8*T_solidus = 1250.52 K; from there E collapses linearly to a floor of 1 % of E(RT) = 1.71 GPa at the solidus. The floor is deliberately NOT zero: the 316L residual-stiffness literature warns that collapsing E to zero merely trades a degenerate tangent for a singular matrix. Result on the graded mesh that frac=0.01 could not solve: ledger 74 and counting with ZERO Newton non-convergences, at the SAME frac=0.01 -- i.e. it converges without increasing the regularization dose, which was the acceptance condition. Constitutive perturbation from the minimum tangent, measured at the graded working strain (eps_p 0.0656): worst sub-solidus row falls from 7.78 % to 0.99 %, because 0.01*E is an order of magnitude smaller in absolute terms once E has collapsed. H/E at the solidus stays exactly 0.01, so well-posedness is preserved by construction rather than by dose."
  acceptance_criterion_3_NOT_met: "Fable5's third P0/trio gate was that the coarse-mesh RS difference between the old and new treatments should land within the offset-vs-cap bracket (2-3 %); anything far above it means the floor / collapse choice is moving the answer and must be re-reviewed. MEASURED on two complete, otherwise-identical 240+40 step coarse runs (v2_full_offset_mt vs v2_full_ecol, cell-by-cell over the top 10000 in-part cells, both complete with identical energy-balance error 4.022e-06): sigma_xx 6.44 %, sigma_yy 14.20 %, sigma_zz 25.90 %, von Mises 7.07 %, eqp 37.87 %. That is 2x to 10x the D-V2-22 bracket, so the gate FAILS as written. The sign is physically coherent -- softer near-solidus material builds less stress and less plastic strain (RMS sigma_xx 41.6 -> 39.4 MPa, eqp 2.06e-3 -> 1.64e-3) -- but coherence is not the same as being free."
  what_criterion_3_implies: "the E-collapse parameters are NOT a numerical detail that can be fixed by fiat: the floor fraction (1 % of E_RT) and the collapse onset (0.8*T_solidus) are now FIRST-ORDER modelling choices that move the validated quantity by more than the deviation they were introduced to fix. Before adoption each needs its own sensitivity bracket reported alongside the RS profile, exactly as the AM literature treats Denlinger's stress-relaxation temperature (reported as a sensitive parameter, not a constant). Adopting (c) on the strength of 'it converges' alone would be swapping a registered numerical deviation for an unregistered physical one."
  bonus_finding: "the collapsed-E coarse run completes 240+40 steps with ZERO Newton non-convergences, against 2 for offset_mt and 6 for cap_mt on the identical mesh and load. Removing the stiffness/strength inconsistency does not merely unlock the finer mesh, it also removes the late-step cutbacks that the original treatment needed on the coarse one."
  melt_reset_arm: "a second arm added item 2 of the literature package (Denlinger/Michaleris stress-relaxation: --phase-history-model legacy_reset + --reset-plastic-on-melt + stress-free reference 1273.15 K, all existing runner switches, no shared code touched). It also clears the failure point cleanly (ledger 67, zero non-convergences). NOTE the phase-history switch is required, not optional: events.py takes the paper_irreversible branch first and skips both the eqp reset and the stress-relaxation reference entirely, so reset_plastic_on_melt is a no-op unless legacy_reset is selected. Whether to take item 2 on top of item 1 is a separate modelling decision -- legacy_reset also changes the T_ref contract, which the runner's own help warns can invert the residual-stress sign."
  items_1_and_3_are_mutually_exclusive: "MEASURED, and it contradicts reading the literature package as three additive ingredients. Superposing the cut-off clamp (item 3) on the collapsed E (item 1) is self-inconsistent: holding the flow curve flat above T_cut while E keeps collapsing drives the solidus row to H1/E = 5.99, i.e. a plastic branch six times stiffer than the elastic one -- exactly the D-V2-22 pathology, recreated. A cut-off has to hold ALL properties above T_cut including E, which is the opposite of collapsing E. They are two alternative routes, not two doses of the same medicine; item 3 was therefore not run in this round."
  why_it_is_the_root_cause: "E(T) is linearly extrapolated to 61.6 GPa at the solidus while the J-C yield collapses to the 1 MPa floor there. A material with essentially no strength but nearly full elastic stiffness is not physical, and it is precisely what drives H/E to 1.6e-4 and makes the elastic predictor overshoot the yield surface by ~280x of the yield strain per step. Option (c) removes that inconsistency; R1 only damps its symptom, and the P0 sweep shows the damping does not scale with mesh refinement."
  resolution_path: "this is the V2 twin of the main case's sigma_y>773 K gap (D-11). Options: (a) linear extrapolation of the [63] trend, (b) hold-last-value, (c) stiffness collapsing toward the solidus (physically motivated, and what our mushy/liquid mechanics factors already do). Decide WITH the main session so both cases treat high-T extrapolation consistently; register the choice and run it as a bracket if the RS profile turns out sensitive. RECOMMENDATION 2026-08-04: (c), decided jointly with D-11. Until it is decided, treat every V2 mechanics result on a mesh finer than coarse as provisional -- the threshold needed to make it converge is itself perturbing the answer."

- id: D-V2-18
  what: the [63] alpha is a MEAN (secant) coefficient referenced to 21 C, not an instantaneous coefficient
  paper_says: "Table 3 footnote a: 'From 70 F to temperature shown'"
  status: open
  adopted: "conversion to instantaneous alpha is REQUIRED (not optional); make_v2_mech_tables.py emits alpha.csv already converted"
  quantified: "2026-07-30 (--quantify): alpha_inst = alpha_mean + (T-21)*d(alpha_mean)/dT exceeds alpha_mean by 1.5 % at 204 C, 7.8 % at 427-538 C, and 18-37 % above 649 C. NOT a negligible mismatch -- using the datasheet secant values directly in an incremental solver whose T_ref is re-anchored at solidification would under-predict high-temperature thermal-strain increments by up to a third, exactly where LPBF residual stress is generated."
  open_sub_issue: "the source table prints alpha_mean to 3 significant digits (0.1e-6 resolution); differencing amplifies that round-off, which is why the derived instantaneous values are non-monotonic (25.2 % at 649 C vs 18.5 % at 760 C). Before the RS gate, fit a smooth alpha_mean(T) (or take alpha(T) from a higher-resolution source and cross-check) rather than shipping the raw differenced values; the differenced table is adequate for scoping, not for the final gate."
  note: "Balbaa's own treatment is unstated, so this is OUR modeling decision. Worth raising with the main session -- the main case consumes alpha(T) too and may have the same secant/instantaneous trap."

- id: D-V2-19
  what: flow-curve regularization at and above the solidus
  paper_says: "nothing -- Balbaa's J-C softening reaches exactly 0 at Tm = 1290 C and his ABAQUS treatment of molten-cell plasticity is unstated"
  status: resolved
  adopted: "R1 (2026-08-04, SUPERSEDES the original): flow stress floored at 1 MPa (unchanged) AND the regularizing hardening changed from a uniform additive H_reg = 1e7 Pa to a segment-wise MINIMUM PLASTIC TANGENT H >= 0.01 * E(T) (model/make_flow_curve_variants.py --min-tangent-frac 0.01)"
  superseded: "R0 (2026-07-31 -- 2026-08-03): flow stress floored at 1 MPa and a uniform H_reg = 1e7 Pa hardening slope added to every row (make_v2_mech_tables.py). R0's floor is retained; only its hardening term is replaced."
  justification_r0: "first substrate-study run (2026-07-31) diverged (u_max -> 1e11) with the unregularized 1e-3 MPa flat floor: thousands of molten cells with near-zero flat yield + liquid_mechanics_factor 1e-4 reproduce exactly the PSD-tangent Newton pathology the repo documented in c475f7e; the adopted values are the SAME regularization pair kaess uses for weak-solid powder (powder-solid-yield 1e6 / powder-solid-hardening 1e7). Effect on the sub-solidus curve < 0.2%."
  why_r0_was_insufficient: "R0 fixed the ABSOLUTE hardening modulus, but the quantity that makes the consistent tangent ill-posed is the RATIO H/E. J-C's softening factor soft(T) reaches exactly 0 at Tm, so on the solidus row every arm collapses to floor + H_reg, giving H/E = 1e7 / 61.6e9 = 1.6e-4 -- near-perfect plasticity across the whole near-solidus band at once. The same 1e7 Pa is irrelevant at room temperature, where J-C supplies its own 35-40 GPa tangent. A regularizer expressed as an absolute modulus therefore cannot be simultaneously right at both ends of the temperature range; tying it to E(T) can."
  evidence_r1: "single-variable ladder on the coarse mesh, 2026-08-04 (vtmp/v_hotreg.sh, results vtmp/hotreg_results.txt), every arm identical to the failing offset arm except one knob. YIELD axis: hy100 (floor 1e6 -> 1e8 Pa) FAILS at ledger=12 with newton_nonconv=5 -- bit-for-bit the same stopping point and failure count as the four D-V2-22 arms; hy10 (floor 1e6 -> 1e7 Pa) does not fail outright but crawls, needing repeated cutbacks to advance. HARDENING axis: htan (H_reg 1e7 -> 1e9 Pa, floor untouched) advances steadily with ZERO Newton non-convergences. Raising the hot yield 100-fold does not help; raising the hot tangent does."
  hy100_is_the_sharpest_evidence: "hy100 looks like it should help most on the yield axis and instead fails identically -- because raising the FLOOR to 1e8 Pa clamps the first segments of BOTH the 1423 K and 1563 K rows flat, driving their H1/E from 1.6e-4 to 0.00 and extending the zero-tangent band from one row to two. So the arm that raised the hot yield the most also flattened the hot tangent the most, and it failed the hardest. Yield level and tangent ratio move in opposite directions in that arm, which is exactly what makes it decisive: the outcome tracks the tangent, not the yield."
  consistency_check: "every arm that has ever advanced past ledger=12 has a raised hot tangent, and no arm without one has: flat (H1/E = 1.6e-2 at the solidus) reached 152, hotfloor (1.6e-2) reached 165, htan (1.6e-2) advanced clean; asis / offset / cap / asis_iter / hy10 / hy100 all sit at H1/E = 1.6e-4 or lower on that row and none of them is healthy. No counterexample in either direction across ten arms."
  why_minimum_tangent_and_not_htan: "htan is a diagnostic arm, not adoptable: an additive 1e9 Pa term raises room-temperature sigma(eps_p=0.2) from 1391 to 1589 MPa (+14 %), i.e. it edits the material response in exactly the sub-solidus regime that generates the residual stress being validated. A segment-wise MINIMUM tangent binds only where the J-C curve has already gone flat. Quantified (model/make_flow_curve_variants.py, offset -> offset_mt): the perturbation is EXACTLY ZERO on every sub-solidus row for eps_p <= 0.02, and the only row that changes at all within the measured working range is the solidus row itself. Measured eq_plastic_strain peaks at 0.004-0.005 in the converging runs, so eps_p <= 0.02 is the range actually consumed. At the far end of the table (eps_p = 0.2, never reached) the high-T rows move by up to +46 %."
  zero_calibration_note: "0.01 is a numerical well-posedness floor on H/E, chosen as the round value one order above the pathological 1.6e-4 and one order below the smallest genuine J-C tangent ratio in the table (0.081 at 1423 K). It is not fitted to any measured quantity -- no XRD, ABAQUS or pyrometer number enters its selection."
  r1_limitation_found_2026_08_04: "R1 IS NOT A SETTLED FIX. The P0 threshold sweep (runs/v_p0sweep.sh, graded mesh) shows two things R1 was never tested against. (a) THE THRESHOLD IS MESH-DEPENDENT: frac=0.01 completes 240+40 steps on coarse but fails deterministically on graded at ledger=40 (twice); frac=0.02 and frac=0.05 both clear that point with zero Newton non-convergences. (b) THE PERTURBATION IS UNBOUNDED IN STRAIN: a constant minimum tangent adds stress proportional to eps_p, so its effect grows linearly with accumulated plastic strain. R1 was validated at coarse's peak eqp of 0.0233, where frac=0.01 perturbs only the 1423 K row and only by 0.41 %. The graded mesh reaches eqp 0.0656 by step 40 of 280 and is still rising, and there the SAME frac=0.01 perturbs 1423 K by 7.8 % and 1273 K by 1.2 %; frac=0.02 -- the smallest value that converges on graded -- perturbs 1423 K by 36 % (offset) / 45 % (cap) and moves even ROOM TEMPERATURE by 0.8 %; frac=0.05 reaches 139-166 % at 1423 K and 17 % at room temperature."
  acceptance_criterion_1_not_met: "Fable5's P0 acceptance required that the constitutive perturbation stay confined to the solidus row at each threshold. On the graded mesh NO converging threshold satisfies that: 0.01 satisfies it but does not converge, and every threshold that converges edits genuine sub-solidus material at the strains actually reached. Reported as a failed criterion, not smoothed over."
  mechanism_of_the_mesh_dependence: "measured, not inferred. The graded mesh refines toward the powder/substrate interface, so at the same 50 W load it puts 14 cells above the solidus (max_temperature_history 1582.2 K) where the coarse mesh puts ZERO (max 1537.7 K), and it accumulates ~3x the plastic strain by step 40 that coarse reaches by step 239. Both effects push more quadrature points onto the degenerate row and further along it, which is exactly the band the regularizer has to dominate -- so the required threshold rises with refinement."

- id: D-V2-20
  what: substrate-discretization probe (D-V2-07) runs at reduced power, NOT at Balbaa parity power
  paper_says: "n/a -- this is a numerics probe, not a Balbaa-comparison run"
  status: resolved
  adopted: "probe power 50 W (peak T ~1400 K, below solidus; scaling from the 220 W probes' ~4700 K rise). Identical load across all three substrate variants."
  justification: "the probe question is whether IN-PART stress depends on substrate z-discretization; that requires the same load on all variants, not a physically faithful melt pool. Sub-solidus load keeps every cell in the well-posed solid regime (no molten-cell mechanics at all) so the discretization signal is not polluted by melt-front numerics. Plasticity still occurs (E*alpha*dT >> sigma_y). The Balbaa-parity 220 W condition remains reserved for the thermal gate, where the missing-keff question must be addressed head-on."
- id: D-V2-16
  what: XRD in-depth profiles exist only as figures
  paper_says: "Sec 4 figures for 140 W and 220 W, scan/hatch directions"
  status: open
  resolution_path: "digitize with the V1 workflow at RS-gate time; record read-off uncertainty per point"

- id: D-V2-21
  what: Balbaa's melt-pool effective conductivity (keff = kl + h*L, his Eq 19-24) is NOT implemented on our side
  paper_says: "Sec 2.5: an FE code cannot carry Marangoni flow, so the quiescent liquid conductivity is artificially raised by keff = kl + h*L with h from Nu = 1.6129 ln(Ma) - 10.183 and L = half melt-pool width. This is an integral part of HIS thermal model, not an optional refinement."
  status: resolved
  adopted: "(c) parity arm + (b) as-is arm, both arms, per the user decision (yuyao 2026-08-04, IET-5). IMPLEMENTED 2026-08-19, NOT YET RUN: model/make_keff_table.py pre-computes Eq 19-24 into a constant liquid-conductivity table consumed via the config key k_table_liquid (phases.py eval_property on the STATE_LIQUID branch, blended through mushy_frac in the mushy band). No shared solver code touched. Arms are model/v2_material_config_thermal_asis.json and _thermal_keff.json, which differ in exactly ONE key -- k_table_liquid -- and the runner asserts that key-by-key before launching the parity arm, so the two-arm difference cannot be contaminated by a second change"
  keff_is_constant_per_condition: "Balbaa's dT is ONE number ('the maximum temperature gradient in the melt pool'), so his keff is one number per process condition, not a function of T. The emitted table is therefore constant across 273.15-6000 K; flat everywhere means np.interp's endpoint clamping cannot introduce an implicit slope"
  worked_value_provisional: "at the gate condition (220 W / 650 mm/s, Ac 0.62, r 50 um, OPD 100 um, Eq-18 beam-centre peak Qv = 3.4734e14 W/m3) with a PROVISIONAL L = 70.5 um (half of V1's OWN predicted 141.0 um case-B width -- our output, not anyone's measurement): dt = 1.085e-4 s, dT = 6695 K, Ma = 1386, Nu = 1.485, keff = 74.74 W/mK = 2.485 x kl. Artifacts: model/tables/k_liquid_keff_provisional.csv + model/derived/keff_provisional.json. The PRODUCTION L is measured from the as-is arm instead (runner stage 2); the provisional pair exists so the number is reviewable before any run"
  chicken_and_egg_handling: "L is an output (D-V1-10). Handled as a single Picard step -- as-is arm -> measure its melt-pool half-width -> keff -> parity arm -- NOT iterated to self-consistency, and NOT taken from any measured pool width. make_keff_table.py refuses to invent an L: with neither --from-run nor --half-width it exits with the reason"
  L_measurement_saturation_FIXED: "FOUND BY REVIEW (Fable5 F1, 2026-08-19) and fixed. The original measurement took the LAST frame and a +/-hatch/2 window around the centre track, then halved the ever-melted y-span. Three defects, all confirmed against the real M1 mesh: (1) the window bounds 1.94/2.06 mm land exactly ON cell centres, and floating point excluded the 1.94 row while including 2.06 -- an asymmetric read; (2) at most 3 rows survive, so the returned L could only ever be 20, 40 or 60 um -- a STRUCTURAL ceiling at hatch/2 = 60 um, below V1's own predicted 70.5 um, meaning the production run would very likely have saturated; (3) it was SILENT -- a saturated L would have flowed into keff (about -21 %) with nothing in the ledger to show for it. Root cause is not the window: once the pool full width (141 um predicted) exceeds the hatch (120 um), adjacent pools overlap and a single-track half-width is not recoverable from the whole-layer cumulative field at all"
  L_measurement_now: "measure at the moment ONE track has just finished and the next has not started, and take the ONE-SIDED (upper) half-width from that track's centre line -- the +y side is virgin material, so it is neither clipped by a neighbour nor by the domain edge. model/pick_keff_measurement.py derives which track, which instant and which window from the path file the as-is arm actually used (no magic numbers in the runner); make_keff_table.py gained --from-run-time (latest frame at or before t) and --from-run-track-y. Verified on a synthetic ever-melted field imposed on the REAL 60000-cell M1 mesh with a true half-width of 70.5 um: the old call now REFUSES with the saturation reason instead of returning 60 um, and the new call returns 80 um"
  L_discretization_bias_is_reported: "80 um against a true 70.5 um is not an error, it is the quantisation: the pool edge falls inside a 40 um cell and that whole cell is counted, so the measured L is resolved only to +/-20 um and the bias is ONE-SIDED UPWARD. That propagates to keff as 59.1 / 87.0 / 108.6 W/mK at L = 60 / 80 / 100 um. make_keff_table.py now emits this as a separate L_discretization bracket rather than folding it into the multiplicative sweep, because a one-sided discretisation bias and a symmetric sensitivity sweep are not the same kind of uncertainty"
  stale_keff_guard: "FOUND BY REVIEW (Fable5 F2) and fixed. Stage 2 skipped whenever the keff file existed, so an as-is arm that died mid-run could seed a keff table that survived the arm being fixed and re-run -- the parity arm would then carry a stale keff for its whole run, invisibly. Now: stage 2 refuses to start unless the as-is arm's ledger reports complete==true (make_keff_table.py enforces the same thing independently, overridable only via an explicit --allow-incomplete-run), and the keff record carries a fingerprint of the as-is run's ledger summary which the runner compares before reusing the table"
  L_sensitivity_is_registered_not_dismissed: "keff depends on L only through ln(Ma), but Ma ~ L^2 (Eq 22 carries L, Eq 24 makes dT carry L too), so dNu/dlnL = 2 x 1.6129 = 3.226 -- NOT weak. Measured bracket at the provisional point (make_keff_table.py --sweep): L x0.5 -> 30.1, x0.75 -> 46.8, x1 -> 74.7, x1.5 -> 114.1, x2 -> 141.9 W/mK. A factor-2 error in L moves keff by about 2.2 x kl. The Qv axis is milder: x0.5 -> 41.1, x2 -> 108.3 W/mK. Both brackets are emitted with every table and must be reported alongside the gate result"
  correlation_has_a_floor_below_which_it_dies: "Eq 21 gives Nu <= 0 for Ma < exp(10.183/1.6129) = 552, i.e. below L ~= 44.5 um at this condition (pool width ~89 um). There keff would fall BELOW the quiescent kl, which is unphysical. The generator clamps Nu at 0 (parity arm degenerates to as-is) and raises a flag rather than emitting keff < kl. This is a real possibility, not a theoretical one: the L x0.5 bracket member above IS the clamped case"
  dT_exceeds_the_boiling_point_and_is_not_clamped: "Eq 23 is an ADIABATIC estimate -- it converts Qv x dt into a temperature rise with no conduction loss -- so at the beam-centre peak Qv it returns dT = 6695 K, implying a peak of 8258 K against Balbaa's own 3000 K boiling point in Table 1. The generator flags this and does NOT clamp it, because clamping dT would be choosing the answer (calibration). Reported as a property of his formula; it is also the strongest single caveat on the parity arm's keff value"
  qv_reading_is_ours: "Balbaa does not say which Qv enters Eq 23. Beam-centre peak Qv (Eq 18 evaluated at x=vt, y=h, z=0) is adopted because his dT is explicitly the CENTRE peak minus solidus, so a peak-to-peak pairing is the self-consistent one. --qv overrides it and the Qv bracket above quantifies the exposure to that choice"
  evidence: "V1 ran without keff and registered the consequence (D-V1-10): pool length -20..-26 %, near-solidus cooling rate ~2.3x fast. V2 substrate probes at Balbaa-parity 220 W show a steady peak of ~5000 K without keff, against Balbaa's own Fig 7 contour max of ~2835 K -- the gap the artificial conductivity is there to close. (An earlier '2882 K agrees with Balbaa' note was retracted in 95f9c58: it was a first-step value under sparse logging.)"
  what_the_gate_must_report: "the arm-to-arm difference is a FIRST-CLASS output, not a by-product (Fable5 2026-08-18): it is the direct input to the DEFERRED Marangoni-upgrade decision in this issue's metadata. model/compare_thermal_gate.py prints it first and reports it even when neither arm matches the pyrometer"
  why_it_blocks: "the V2 THERMAL gate compares against two-colour pyrometer temperatures. Peak temperature is exactly the quantity keff controls, so the gate cannot be interpreted without deciding this. Unlike V1 (where the missing keff only degraded two secondary metrics), here it sits on the primary observable."
  options: "(a) implement an effective-conductivity model in the solver -- SHARED CODE, requires main-session coordination before any edit; (b) run the gate without keff and report the peak-temperature gap as the headline finding (zero-calibration-clean, and arguably the more honest code-to-code statement: 'his agreement depends on an artificial conductivity we do not use'); (c) pre-compute a fixed keff multiplier from his Eq 19-24 at the gate condition and feed it as a liquid-conductivity table value -- no solver change, but it freezes L (half pool width) which is itself an output (chicken-and-egg, cf. D-V1-10)."
  resolution_path: "DONE on the implementation side -- (c) + (b) built, preflighted and smoke-verified 2026-08-19; production runs and acceptance belong to Fable5 (IET-8 division of labour). Option (a) was NOT taken and no shared solver code was modified. Remaining before the gate can be READ: run both arms, replace the provisional L with the as-is measurement, and report the L bracket with the result."

- id: D-V2-22
  what: "the Johnson-Cook hardening term has an unbounded tangent as eps_p -> 0; tabulating it as printed makes the first flow-curve segment stiffer than the elastic modulus"
  paper_says: "nothing -- Balbaa gives A, B, n (p.33: 650 MPa / 1618 MPa / 0.243) and says the J-C law was used in ABAQUS. How the eps_p -> 0 limit is handled (ABAQUS-internal sub-incrementation, a tabulated curve, or an offset convention) is not stated."
  status: resolved
  adopted: "offset -- sigma = A + B*[(eps_p + 0.002)^n - 0.002^n] -- as the main arm, cap as the RS sensitivity bracket (user decision D-V2-22, yuyao 2026-08-04, IET-5). Both are consumed together with the D-V2-19-R1 minimum plastic tangent, which is what actually unblocks the solve; the production tables are flow_curve_offset_mt.csv and flow_curve_cap_mt.csv."
  causal_claim_retracted: "RETRACTED 2026-08-04 -- the near-zero tangent singularity is REAL as a transcription finding (the numbers below stand), but it is NOT the cause of the mechanics non-convergence, and this entry originally asserted that it was. Falsification: the A-phase ladder spans the near-zero tangent from H1/E = 2.98 (asis) through 0.23 (offset) to 0.10 (cap) -- a 30-fold span across the disputed quantity -- and all three arms fail IDENTICALLY, at the same ledger=12 / global_step=10, with the same signature. A fourth control (asis + max-iter 200 + max-cuts 6) rules out solver settings. The reason is visible in the generator itself: J-C's softening factor soft(T) reaches exactly 0 at Tm, and it multiplies the hardening term B*(...)^n that is the ONLY thing the three arms differ in. On the near-solidus rows the three arms are therefore point-for-point identical, so the ladder never varied the segment that was failing. The real cause is registered under D-V2-19-R1 (hot-end tangent ratio H/E), established by a second single-variable ladder."
  why_the_first_bisection_misled: "the v2_T1_coarse control that appeared to indict the flow curve changed three things at once (constant 490 MPa yield across all temperatures, constant 1 GPa hardening, and a different consumption path -- yield_table + hardening_table instead of flow_curve_table). Two follow-up arms delivered via flow_curve_table separated them: flat (T1's placeholder pair, delivered through flow_curve_table) reached ledger=152 and hotfloor (offset near-zero end + T1's hot floor) reached ledger=165, both with zero Newton non-convergences. flat clears the shared consumption path of any fault -- so no shared solver code is implicated, and none was touched."
  evidence: "All three substrate variants (v2_sub5_*, 2026-08-03) failed in the mechanics Newton solve -- force_ratio 1.5e6 with displacement_correction_ratio 5.1e-14, i.e. the correction collapses to zero while the residual does not fall. A bisection variant with flow_curve_table replaced by constant yield/hardening placeholders (v2_T1_coarse) ran 154 steps cleanly. Direct measurement on tables/flow_curve.csv: at 294.15 K the segment eps_p 0 -> 0.002 has H = 178.7 GPa against E = 171.0 GPa (H/E = 1.04), then drops 6x to 29.7 GPa. Cause is analytic, not discretization: dsigma/deps_p = B*n*eps_p^(n-1) with n = 0.243 diverges as eps_p^(-0.757). Refining the grid makes it WORSE, verified -- adding points at 5e-4 raises H_seg1 to 510 GPa (H/E = 2.98), so 'the table is too coarse' is excluded as an explanation and the power law itself must be regularized. This finding is retained on its own merits (see physical_cross_check): a first segment stiffer than E is indefensible regardless of whether it also broke the solve."
  physical_cross_check: "as printed, the curve reaches 1746 MPa true stress at eps_p = 0.2, above any measured IN625 flow stress; the offset reading gives 1391 MPa, consistent with a ~1000 MPa engineering UTS (true stress ~1200 MPa). As printed, sigma jumps from A = 650 MPa at eps_p = 0 to 1007 MPa at eps_p = 0.002 -- i.e. B*0.002^n = 357 MPa of hardening appears at infinitesimal plastic strain."
  arms: "screening ladder on the coarse mesh, model/make_flow_curve_variants.py (asis / offset / cap) plus an asis + max-iter 200 + max-cuts 6 control that rules out 'merely solver settings'. offset: sigma = A + B*[(eps_p + 0.002)^n - 0.002^n], the 0.2%-offset convention implied by A being an offset yield stress -- sigma(0) = A exactly, H(0) = B*n*0.002^(n-1) = 43.4 GPa = 0.25 E. cap: slope-limited integration with H <= 0.10*E(T), the bracketing arm."
  rs_sensitivity_bracket: "MEASURED 2026-08-04, reported not fitted. offset_mt vs cap_mt, both COMPLETE over 240 scan steps + 40 cooling steps on the coarse mesh, identical mesh / path / solver settings, so the top-layer 10000 in-part cells are compared cell-by-cell with no interpolation (model/../compare_arms.py, final frame step_000239_cooling.vtu). Relative RMS difference: sigma_xx 1.96 %, sigma_yy 3.14 %, sigma_zz 2.64 %, von Mises 1.95 %, eqp 1.02 %. Bracket width is therefore ~2-3 %."
  bracket_interpretation: "offset and cap differ 30-fold in the disputed quantity (room-temperature near-zero tangent H1/E = 0.23 vs 0.10) yet move the in-part residual stress by only 2-3 %. The D-V2-22 reading choice is therefore NOT a leading RS uncertainty -- it sits far below the typical ABAQUS-vs-XRD gap that the RS gate (IET-9) will be judged against. Reported as-is per the user decision; nothing calibrated."
  convergence_evidence: "first complete V2 mechanics runs. offset_mt: ledger=240, newton_nonconv=2, rc=0, ledger complete=true, max relative energy-balance error 4.022e-06. cap_mt: ledger=240, newton_nonconv=6, rc=0, same balance error. Honest qualifier: neither arm is failure-free -- both take a handful of Newton non-convergences in the late, hottest steps, all absorbed by sub-step cutback, and both finish normally. Against the same mesh and load, asis / offset / cap / asis_iter / hy100 all die at global_step=10. This is at the D-V2-20 probe power of 50 W; convergence at Balbaa-parity 220 W is NOT yet demonstrated."
  why_it_blocks: "RESOLVED -- V2 mechanics is unblocked as of 2026-08-04; the RS gate and the D-V2-07 substrate study can proceed. It never affected V1 (thermal-only) or the thermal gate."
  resolution_path: "DONE -- offset adopted as the main arm, cap retained as the bracket, per the user decision; the actual unblocking change is D-V2-19-R1. The escalation clause ('if neither converges, stop and report before touching shared code') was triggered on its face -- offset and cap both failed -- but did NOT resolve to a shared-solver problem: the flat arm proved the flow_curve_table consumption path healthy, so the fault was localized to a V2-owned input table and fixed there. No shared solver code was modified."
  main_line_relevance: "two transfers, both about tabulated flow curves rather than about Johnson-Cook (which the main AMB2018-01 case does not use). (1) any tabulated flow curve whose FIRST SEGMENT is stiffer than E produces the signature huge force_ratio + vanishing displacement correction; (2) the more general and more dangerous one, D-V2-19-R1: any temperature-dependent flow curve that softens toward a floor while E(T) does not collapse with it will drive H/E toward zero over a whole band of cells at once, and an absolute-valued hardening regularizer will silently stop being sufficient as the band grows. A guard in whatever consumes flow_curve_table -- assert min-over-rows H/E above some small threshold, and assert H1 < E -- would have caught both at table-load time instead of at Newton stagnation, and is worth raising with the main session."
  measurement_hygiene_note: "the plastic-strain axis of flow_curve_table is endpoint-CLAMPED in jax_fem/materials/j2.py::_interpolate_clamped, so beyond the table's last knot (eps_p = 0.2) the tangent is exactly zero. This was considered as a candidate cause and EXCLUDED by measurement, not by argument: eq_plastic_strain peaks at 0.004-0.005 in the converging runs (v2_fc_hotfloor / v2_fc_flat / v2_T1_coarse), two orders below the clamp, so the clamp is never reached at this load. Recorded because it WOULD become live at Balbaa-parity power, where the hot band is far larger."

- id: D-V2-23
  what: the pyrometer comparison protocol is under-determined in three places, and Fig 14 is not what "temperature trajectory" implies
  paper_says: "Sec 3.3: 'the elements temperatures above 1000 degC, i.e. the lower limit of the pyrometer, within a 2 mm diameter circle were averaged and compared to the pyrometer measurements ... the temperatures calculated from the model are extracted and averaged at an increment of 10 ms'"
  status: resolved
  scope_finding_first: "SCOPE. Fig 14 is FIVE discrete point pairs (5 open squares = experiment, 5 open triangles = his ABAQUS) spanning t = 0.548 .. 0.733 s -- NOT a continuous 10 ms-resolved trace. The gate's comparable observable is therefore 5 samples, and the 10 ms in Sec 3.3 describes the MODEL-side extraction increment, not the density of published data. Any claim of trace-shape agreement would be reading structure the figure does not contain"
  digitized: "inputs/balbaa-fig14-pyrometer.json, produced by model/digitize_fig14_pyrometer.py from the page-17 EMBEDDED bitmap at native 2755x1804 (no re-render, so no resampling error). Experiment (degC): 1147.1 / 1399.3 / 1469.6 / 1423.1 / 1389.4. His ABAQUS: 1183.8 / 1348.0 / 1402.0 / 1619.0 / 1157.3, at t = 0.5480 / 0.5923 / 0.6227 / 0.6526 / 0.7326 s"
  read_off_uncertainty: "+/-2.5 degC on the experimental points, +/-3.8 degC worst over all ten, and +/-0.6 ms in time. Budget is per point and itemised in the JSON: frame-line half-thickness + tick-grid cross-check residual (an INDEPENDENT second calibration from the outward tick marks, max residual 2.5 px in x / 2.0 px in y) + marker-anchor ambiguity (bounding-box centre vs pixel centroid). Much tighter than V1's Figs 8-10 digitization (D-V1-09) because these are large discrete markers on a clean plot rather than bar tops"
  balbaa_own_gap_is_the_yardstick: "his own ABAQUS-vs-pyrometer residuals, from the same digitization, are +36.7 / -51.3 / -67.6 / +195.9 / -232.1 degC -- RMS 142 K, worst 232 K, against a text that calls the agreement 'good'. Our arms must be judged against THAT gap, not against zero (SPEC Acceptance framing). Recorded because a 200 K discrepancy on our side would otherwise read as a failure when it is in fact parity"
  convention_a_spot_centre: "not stated. Adopted: the centre of the 4x4 mesh window, which under D-V2-09 is the centre of the 10x10 exposure area. --spot-center overrides"
  convention_b_depth: "not stated. Adopted: TOP POWDER LAYER cells only, because a two-colour pyrometer is an optical surface instrument and cannot see sub-surface elements. --all-depths runs the alternative; the choice matters because sub-surface cells are cooler and would drag the average down"
  convention_c_bin_reading: "'averaged at an increment of 10 ms' is ambiguous between a bin AVERAGE and a 10 ms SAMPLE. Both are computed; the bin average is adopted and the nearest-frame sample is emitted alongside as nearest_frame_avg_K, so the reading choice is measurable rather than assumed away"
  instrument_range_ceiling_diagnostic: "Balbaa applies only the pyrometer's 1000 degC LOWER limit; the instrument also has a 3000 degC upper limit, and the as-is arm is expected to run far above it. The adopted figure follows his stated protocol (no ceiling), and a second series avg_range_limited_K excludes cells above 3000 degC. This is a DIAGNOSTIC, not a competing adoption -- but the two numbers must both be looked at, because 'the model averages temperatures the instrument physically could not have reported' is a live confound on the as-is arm specifically"
  cell_temperature_definition: "element temperature = arithmetic mean of its 8 nodal temperatures. Stated because 'element temperature' has no unique meaning for a nodal FE field"
  implementation: "model/analyze_pyrometer.py (extraction), model/compare_thermal_gate.py (two-arm difference + triangle), model/tests/make_synthetic_thermal_run.py (synthetic run dir so the whole analysis chain can be exercised without a solver)"

- id: D-V2-24
  what: "the pyrometer observable is reported three ways in parallel, because the adopted protocol is a field statistic and not a model of the instrument"
  paper_says: "Sec 3.3 gives exactly one recipe: elements above 1000 degC inside a 2 mm circle, averaged, at a 10 ms increment. He says nothing about how a two-colour pyrometer actually forms a reading, and nothing about what the reading does when the number of qualifying elements changes."
  status: resolved
  the_finding_that_forced_it: "FIELD-LEVEL, from the box-159 production VTUs (Opus5 2026-08-20, IET-19). Over the Fig 14 observation window the as-is arm's in-circle peak cell temperature has a linear trend of -27 K (parity +51 K) -- the field is FLAT. Over the same frames the adopted reading falls 2711 -> 1791 K (-919 K) while n_hot rises 11 -> 140 (x12.4) against 1976 top-layer cells in the circle. The adopted reading's shape is therefore almost entirely its own denominator. Balbaa saw the same mechanism from the other side (p.17): he attributes his own high-end residual to 'the calculated temperature is averaged over the melt pool; a difference in the melt pool area will affect temperature prediction'."
  adopted: "THREE PARALLEL READINGS, none replacing another, all on identical geometry (same circle centre, same 2 mm diameter, same top-layer-only depth, same 8-node-mean cell temperature) so the columns are directly comparable. (1) adopted conditional average avg_K -- Balbaa Sec 3.3 verbatim, NOT ONE CHARACTER CHANGED, and it remains the ruler for the code-to-code leg. (2) two-colour synthetic two_colour_K -- instrument physics, the ruler for the code-to-experiment leg. (3) full-spot unthresholded mean full_spot_avg_K -- diagnostic lower bound, what the reading is when the denominator is taken to its maximum."
  two_colour_conventions: "Planck spectral radiance at two wavelengths, grey body, ratio inverted for temperature. Si/Si 0.95 / 1.05 um (the paper says only 'Si/Si ~1 um'; the CHANNEL SEPARATION is ours and is bracketed, see below). Constants CODATA 2018, C2 = hc/k = 1.4387769e-2 m K. Cells carry equal area on the uniform 40 um top layer, so the area weight cancels and the channel signal is an arithmetic mean of radiances. NO THRESHOLD at cell level -- at 1 um the Wien tail makes cold cells negligible, and that is MEASURED not asserted: cells below 1000 degC contribute at most 3.9e-4 of the short-wavelength channel on any beam-in-circle frame. Bin reading averages the two channel SIGNALS across the bin and inverts once, because a 10 ms instrument integrates radiance, not temperature; the invert-then-average alternative is emitted alongside as two_colour_frame_mean_K."
  two_colour_self_check: "a uniform field must be recovered exactly. model/two_colour_pyrometer.py::uniform_field_self_check inverts 1273.15 / 1800 / 2500 / 3273.15 / 4800 K and returns them to within 6.4e-7 K. analyze_pyrometer.py RUNS this check before it will emit any reading and refuses to write output if it fails -- a sign error in the inversion would otherwise produce a plausible-looking curve, which is worse than having no such reading at all."
  range_handling: "the instrument is 1000-3000 degC. The inversion is NOT clamped (clamping is calibration); over-range bins are counted and flagged separately. On the as-is arm 5 of the 10 ms bins read above the 3000 degC ceiling. The real gauge did not saturate at the Fig 14 sample times -- it reported 1389-1470 degC -- so this is not a reading-convention problem, it is a level problem in the field."
  wavelength_separation_bracket: "ours, since the paper gives no channel split. At the peak adopted-reading frame the as-is field reads 3703.4 K at 0.05 um separation, 3703.4 K at 0.10 um (adopted), 3703.3 K at 0.20 um -- the choice moves the reading by ~0.1 K and is therefore NOT a live uncertainty. Emitted with every extraction under --tc-sensitivity so it stays measured rather than assumed."
  what_the_three_readings_showed: "on the existing production fields, re-read with zero GPU: at the four scoreable Fig 14 times the as-is arm gives adopted 2711/2211/1981/1793 K, two-colour 3703/3356/3195/3007 K, full-spot 515/567/596/577 K, against experiment 1672/1743/1696/1663 K. The two-colour reading is HIGHER than the adopted one, so switching to a fairer instrument model makes the level disagreement WORSE, not better. RMS vs experiment: adopted as-is 591 / parity 303 K; two-colour as-is 1642 / parity 945 K; Balbaa's own ABAQUS 142 K."
  the_reading_must_match_the_leg: "code-to-code may only be scored on the adopted reading (it is his protocol); code-to-experiment may only be scored on the two-colour reading (it is the instrument's physics). Reading them crosswise produces the IET-19 artefact where the two late points looked like agreement -- they were dilution at n_hot = 140, and the two-colour reading at the same instants is 3000 K."
  arm_difference_per_reading: "the arm-to-arm difference (the DEFERRED Marangoni decision input, D-V2-21) is now reported per reading, because the three weigh the core very differently: parity - asis is -189 K mean / 481 K worst on adopted, -108 K mean / 832 K worst on two-colour, and -4 K mean / 17 K worst on full-spot. Reporting only one of these would compress the decision input into a number whose size depends on a reading convention."
  zero_calibration: "nothing here is tunable toward the measurement. Wavelengths are instrument spec, grey body is the definition of a ratio pyrometer, equal area weighting is a property of the mesh, and the 1000/3000 degC limits are the gauge's range."
  implementation: "model/two_colour_pyrometer.py (instrument, standalone self-check), model/analyze_pyrometer.py (three readings per frame and per bin), model/compare_thermal_gate.py (parallel scoring, per-reading arm difference, CSV table), model/check_adopted_reading_unchanged.py (regression), model/runs/v_reread_three_readings.sh (zero-GPU re-read of the existing fields)."
  adopted_reading_regression: "the three readings are ADDITIVE. check_adopted_reading_unchanged.py compares the new extraction against the 2026-08-19 production artefacts value-by-value at zero tolerance: 90 frames x 9 fields + 72 bins x 11 fields + 5 scalars, both arms, all equal. The eight added fields are new keys only."

- id: D-V2-25
  what: "the thermal output frame spacing beats against the track period, so the gate's temperature 'curve' is a sequence of snapshots at drifting scan phase"
  paper_says: "nothing -- the paper does not specify a model-side output cadence. This is entirely our configuration, which is why it is fixable without leaving parity."
  status: open
  the_arithmetic: "runs/v_thermal_gate.sh sets --thermal-output-every 100 at dt = 7.6923e-5 s, i.e. a 7.6923 ms frame spacing. One track takes 9.8 mm / 650 mm/s plus jump = 15.101 ms. Frames therefore land on the beam only every other frame, and every hot frame in the production run is spaced 15.33 ms apart -- the preregistered '<= 10 ms between hot frames' criterion FAILED at 15.33 ms. The phase drifts 15.3846 - 15.1009 = 0.2837 ms per track, while the beam is only inside the 2 mm circle for 2 mm / 650 mm/s = 3.077 ms (20.4 % duty)."
  observed_not_inferred: "the drift is visible in the production fields, not just predicted. Beam-to-circle-centre distance on the twelve hot frames runs 0.931 -> 0.760 -> 0.600 -> 0.466 -> 0.384 -> 0.390 -> 0.480 -> 0.618 -> 0.780 -> 0.953 -> 1.132 -> 1.315 mm: the sampling phase walks in to the centre and back out. On the intervening frames the hottest cell anywhere in the circle is 990 down to 841 K -- the whole spot drops below the 1273 K threshold within 7.7 ms of the beam leaving."
  what_it_did_and_did_not_break: "BROKE: the t = 0.548 s experimental point is unscoreable (both frames in that bin sat at beam-out phase), the 10 ms bin average degenerated to single-frame sampling, and the peak-instant falsification check became unreadable (32.1 vs 30.2 ms threshold). DID NOT BREAK: the level disagreement or the curve shape -- those are D-V2-24 and D-V2-26. Denser output will not make the gate look better, and nobody should read it as a failed fix when it does not."
  consequence_for_the_two_colour_reading: "the adopted reading is undefined on beam-out bins (nothing is above threshold), but the two-colour reading always has a value, so its raw series alternates ~3000-3700 K with ~650-950 K. Interpolating that sawtooth in time is meaningless -- at t = 0.5923 it would return 2939 K, a number that is neither the field nor anything the instrument would report. compare_thermal_gate.py therefore scores all three readings on the bins where the adopted reading is also defined, and reports the beat exposure separately as an aliasing_envelope per sample time instead of hiding it inside an interpolation."
  resolution_path: "IET-20 deliverable 3: an online in-circle observable recorder that accumulates every solver step (dt = 76.9 us) inside a configurable window. WIRED INTO THE PRODUCTION RUNNER 2026-08-24: both as-is and parity arms must emit online_observables.jsonl/meta or the runner fails closed. The 10 ms response aggregator weights every record by its actual dt overlap with each bin and splits steps crossing bin boundaries; plain sample means are forbidden. The production re-run remains a separate C-package action."

- id: D-V2-25-R1
  what: "Balbaa Eq.18 volumetric source was previously deposited through the whole fixture instead of being confined to the 40 um powder layer"
  paper_says: "the multi-track thermal model applies the volumetric heat flux to the powder layer; layer thickness is 40 um and optical penetration depth is 100 um"
  status: resolved-not-run
  adopted: "production thermal-gate runner now sets source_depth_cutoff=40 um and source_cutoff_renormalize=true for both arms. The exponential profile is truncated at the powder/substrate interface and renormalized by 1-exp(-40/100), preserving Balbaa's total absorbed power while preventing unphysical fixture deposition. Kernel and thermal ledger use the same -expm1 expression; legacy behavior remains the solver default for unrelated cases."
  consequence: "this changes the thermal field and invalidates reuse of pre-fix gate outputs or a keff table fingerprinted from them. Both arms and the keff derivation must be rerun; no numerical result is claimed by this implementation change alone."
  zero_calibration: "the 40 um cutoff is fixed by the paper's layer thickness, not selected against Fig 14; renormalization preserves the paper's Ac*P power rather than tuning a peak temperature."

- id: D-V2-26
  what: "no vaporization heat sink -- and this is the reference model's OWN capability boundary, inherited as-is, not a reproduction gap on our side"
  paper_says: "Table 1 lists 'Boiling temperature (Tb) 3000 K' and 'Latent heat of vaporization (LV) 640 kJ/kg.K' (the unit is misprinted with a spurious .K, exactly as the fusion row is). Eq (1)-(24) then NEVER use either quantity: there is no evaporative flux, no Tb clamp, and no LV term anywhere in his formulation."
  status: accepted-gap
  the_decisive_evidence_is_his_own_text: "p.17, describing HIS Fig 15 result: 'resulting in a peak temperature higher than the boiling temperature ... the temperature drops from 2900 degC down to 570 degC'. His model runs past the boiling point and does not clamp it either. So boiling_temperature = None on our side is PARITY with Balbaa, not a defect against him. The two Table 1 rows are tabulated properties he did not consume."
  requalified_from: "IET-19 originally called this a 'reproduction gap'. That framing is withdrawn. It is a physics-upgrade item and a shared boundary of both models -- ours and his. Restating it correctly matters, because a gap implies we failed to copy something he did, and he did not do it."
  the_positive_evidence_that_it_is_nonetheless_real_physics: "the case for vaporization is no longer 'we exceed the boiling point so the result is not credible' (an argument from outside the data). It is now quantitative and instrument-side: read with its own physics (D-V2-24), our field gives 3007-3703 K against a measured 1662-1743 K, and the real gauge -- which saturates at 3000 degC -- did NOT saturate at those instants while our field would have. That is a measured 1300-2000 K excess, not an extrapolation."
  scope_note_enhanced_physics_is_PARKED: "yuyao 2026-08-20 (IET-19): the enhanced-physics arm is deferred; establish the completeness and repairability of the present test first. This entry therefore registers the boundary and its evidence and stops there. NOTHING in this entry authorises adding a vaporization term to any arm."
  when_it_is_taken_up: "it must be a THIRD arm (as-is / parity / enhanced), never a modification of the parity arm -- adding a sink Balbaa does not have leaves Balbaa parity by definition. The property values must come from an audited source, NOT from his Table 1: 640 kJ/kg is an order of magnitude below the literature IN625 value of ~6.3-6.4 MJ/kg, so the printed row is unusable regardless of which model wants it (GPT5.6sol 2026-08-20 asked for this transcription cross-check; Fable5 confirmed the row is printed as stated in the paper, so the discrepancy is the paper's, not a transcription error on our side). A hard 3000 K temperature clamp is NOT an acceptable substitute -- clamping to a known answer is calibration."
  code_status: "jax_fem_am has zero hits for boil|vapor|evapor; the production used_config.json carries no boiling_temperature or latent_heat_vaporization key. Nothing is silently half-implemented."

- id: D-V2-27
  what: "Figs 15 and 16 (three-point temperature histories and cooling rates) digitized as code-to-code targets"
  paper_says: "Sec 4.2.1 p.17: 'The temperature history is plotted at three points' spaced 1 mm apart, plus the corresponding cooling-rate figure."
  status: resolved
  evidence_nature_first: "THESE ARE HIS MODEL OUTPUT, NOT MEASUREMENTS. Verified against p.17 (Fable5 2026-08-20, closing a check GPT5.6sol raised): the only time-resolved EXPERIMENTAL data in the whole paper is the five pyrometer points in Fig 14. Fig 15/16 are therefore a code-to-code target and can never serve as independent experimental validation. Recorded first and prominently because a temperature-history curve is exactly the kind of figure that gets cited as validation by mistake."
  why_they_are_worth_having_anyway: "they are the only observable in the paper with NO conditional-average denominator. A fixed probe has no n_hot, so the 1/n_hot dilution that dominates Fig 14 (D-V2-24) cannot touch them; shape, melting, solidification and cooling rate become directly comparable. They are the cleanest code-to-code target the paper offers."
  digitized: "inputs/balbaa-fig15-16-thermal-history.json, produced by model/digitize_fig15_16.py from the page EMBEDDED bitmap at native resolution (no re-render, so no resampling error), using the same toolchain and the same per-point uncertainty budget as D-V2-23's Fig 14 digitization: frame-line half thickness + an INDEPENDENT tick-grid cross-calibration residual + curve-thickness anchor ambiguity, combined in quadrature."
  read_off_uncertainty: "reported per curve and per sample in the JSON. Continuous curves carry a larger anchor term than Fig 14's discrete markers, because the anchor ambiguity is half the plotted line thickness rather than a marker centroid -- this is a real and stated difference in evidence quality between the two figures, not a defect in the tracing."
  what_it_unblocks: "with the D-V2-25 recorder writing fixed probes online, our side of this comparison exists without any further field output. Scoring belongs to the re-run (C package); this entry delivers the target and its uncertainty."
  probe_semantics: "scoring spec 6.1 @ 3b9c220: a probe reads the top-layer cell CONTAINING its coordinate as an arithmetic mean of the cell's 8 nodes, tie-broken by nearest cell centre then smallest element id. NOT the nearest node -- on a hex the eight corners are equidistant from the centre, so a nearest-node argmin degenerates to an arbitrary corner, and at the |dT/dy| ~ 1750 degC/mm this figure reports that differs from the cell mean by more than the digitisation budget. Found by Fable5 in acceptance review 2026-08-20 and fixed in 876fe00. All three pre-registered probes land exactly on a four-cell shared edge, so BOTH tie-break levels execute on every probe -- the meta file records the element-id convention actually used (0-based fe.cells row index) and the observed tie count."
  model_side_gradient: "ADOPTED 2026-08-21 (Fable5 recommended, Opus5 decided) so that scoring spec 6.3.5 can be scored rather than marked unavailable -- the paper-side dTx/dTy are already digitized here, so leaving the model side out would have delivered half a comparison. Definition: the gradient of the trilinear interpolant evaluated at the centre of the CONTAINING cell, i.e. the same cell the probe temperature comes from, computed through the isoparametric Jacobian so it stays exact for any hex. On a structured axis-aligned grid it reduces exactly to the +/-x, +/-y face-mean difference quotient, which is what makes it checkable by hand; that equivalence is asserted in tests/unit/test_online_observables.py rather than merely claimed. Emitted per record as the SIGNED vector probe_grad_K_per_m = [dT/dx, dT/dy, dT/dz]; spec 6.3.5 wants the moduli, and taking them downstream keeps the sign auditable. Scan direction is +x and hatch direction is +y by the D-V2-09 path convention, fixed before any run -- spec 6.3.5 forbids swapping the two to improve agreement. A degenerate element yields null, never a fabricated gradient."
  fig15_read_off_disclosures: "TWO one-sided/conditional exposures that the symmetric +/-sigma_T budget does not represent, both required by Fable5's B-package review 2026-08-20 and now emitted in the JSON. (1) PEAK IS ONE-SIDED: derived.peak_temperature_C takes the topmost pixel of the column, which where the peak tangent is horizontal reads the stroke's UPPER EDGE = centreline + half a linewidth. That is a fixed-direction bias of +7.07 / +4.71 / +5.89 degC for P1/P2/P3, inside the +/-14 degC budget but NOT cancelling like a random term, so peak_temperature_centerline_C is emitted alongside and the reader must state which one they used. (2) STEEP SEGMENTS ARE TIME-DOMINATED: on the near-vertical spikes the effective uncertainty is sigma_t x local slope, not sigma_T. With sigma_t = 1.38 ms and |dT/dt| up to 4.1e6 degC/s the effective sigma reaches 3341 / 5679 / 3016 degC, and 130 / 117 / 116 columns per curve exceed twice the read-off term. Per-column dT_dt_C_per_s, temperature_C_uncertainty_from_time and temperature_C_uncertainty_effective are emitted. Spec 6.2 compares in the TIME domain at the digitized instants and sets no pass line for Fig 15/16, so this is a disclosure requirement rather than a defect -- but a temperature-domain comparison on a spike would be meaningless and the numbers now say so."


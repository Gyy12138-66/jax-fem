# V2 cube-RS deviation registry (Kaess discipline: register, don't silently fill)
# Scope: reproducing Balbaa2022 multi-track + multi-layer models for the
# thermo-mechanical code-to-code comparison. Thermal-property deviations
# D-V1-01..20 are inherited from ../v1-single-track/inputs/deviations.yaml
# and not repeated.
# Status values: open | resolved | ambiguous | accepted-gap | blocked-on-L3
#   ambiguous = the paper admits TWO defensible readings and nothing in it
#   separates them; both recorded, one adopted and named as adopted, exposure
#   quantified (see D-V1-19 for the worked example).

- id: D-V2-01
  what: Table 4 J-C parameters are NOT what the paper's RS predictions used
  paper_says: "p.33: A, B, n replaced by measured as-built tensile values (650 / 1618 MPa / 0.243); C, m retained from Table 4; same set for all process parameters"
  status: resolved
  adopted: "modified set (650/1618/0.243/2.09e-4/1.146), transcribed in balbaa-v2-model.json constitutive_actually_used"
  justification: "transcription trap of the same class as V1's D-V1-20 (figure vs printed equation); the text on p.33 is explicit"

- id: D-V2-02

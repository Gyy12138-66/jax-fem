- id: D-V2-08
  what: multi-track step time is the 10x10 mm exposure time but the modeled layer is 4x4 mm
  paper_says: "'step time was set as the total time required to expose a layer with a cross-section of 10 mm x 10 mm, the same size as the experiments' (p.9)"
  status: resolved
  adopted: "(c) windowed model of the REAL part -- implemented 2026-08-19 in model/make_v2_path_multitrack.py --exposure-area 10.0e-3. The laser follows the full 10x10 mm serpentine (83 tracks at hatch 0.12, t_end = 1.2534 s); the 4x4 mesh is a spatial window centred in it; path coordinates are emitted in MESH frame so out-of-window rows carry coordinates outside [0,4] mm by construction. Generator is backwards compatible: without --exposure-area it reproduces the previous output byte-for-byte (verified against HEAD for both the --tracks 3 substrate-probe call and the full-layer call)"
  leading_reading: "(c) windowed model of the REAL part: the DFLUX laser position follows the full 10x10 mm serpentine toolpath over the full exposure time (~83 tracks at hatch 0.12); the 4x4 mesh is just a spatial window -- whenever the laser is outside it, the Gaussian tail deposits nothing in-domain. This single reading explains the sentence with no extra assumption, reproduces the pyrometer trace duration AND the neighbor-track reheating cycles, and is directly expressible in our path-file (generate the full 10x10 path verbatim; out-of-window rows deposit ~0; energy ledger reports per-step capture honestly)"
  evidence_alternatives_falsified: "DECIDED BY THE FIGURE, not by preference. Fig 14 (digitized 2026-08-19, inputs/balbaa-fig14-pyrometer.json) puts BOTH the experimental and Balbaa's own numerical points at t = 0.548 .. 0.733 s with T = 1147 .. 1619 degC, i.e. his model still has material above the pyrometer's 1000 degC floor at t = 0.733 s. A 4x4 mm layer at 650 mm/s and hatch 0.12 is 33 tracks x 4 mm = 132 mm of track = 0.203 s of exposure. So (b) truncated time never reaches the first sample point at all, and (a) laser-off padding would have the domain cooling freely from t = 0.2 s -- neither can produce a 1619 degC numerical point at t = 0.65 s. Only (c) survives. This argument uses only the printed TIMING, which is what resolution_path pre-registered as the deciding evidence; no temperature value was fitted"
  corroboration_independent: "the generator's own t_end for the full 10x10 path is 1.2534 s, against Balbaa's text 'until the end of exposure at 1.25 s' (Sec 4.2.1, describing Fig 17). That sentence was not used to build the path -- the path time comes from 83 tracks x 9.8 mm / 0.650 m/s plus jump time -- so the agreement is a check, not a construction"
  cost_note: "the honest cost of (c) is that only 16.28 % of the path's nominal energy lands in the 4x4 window (erf-integrated over the Gaussian, model/make_v2_path_multitrack.py --ledger-json). The other 83.72 % is deposited on material we do not mesh. That is a property of the reading, not a modelling error: Balbaa's own 4x4 model has the same property"
  resolution_path: "DONE -- (c) adopted on the figure-timing evidence above; alternatives (a) laser-off padding / (b) truncated time are recorded as falsified, not merely unchosen"

- id: D-V2-09
  what: stripe width / start corner / serpentine phase
  paper_says: "stripe scan with serpentine motion [50]; no stripe width, start position, or first-track direction"
  status: resolved
  adopted: "single stripe / plain serpentine over the 10x10 exposure area; first track at y_min scanning +x; hatch advances +y; the 4x4 mesh window CENTRED in the exposure area (so the window spans 3..7 mm in both axes). Registered as OUR convention, exactly like the kaess start-angle -- Balbaa states none of it"
  justification: "the 10 mm exposure extent is still at or below a typical EOS stripe (5-10 mm), so a single stripe remains the minimal reading; centring the window is the only placement that does not additionally assume where on the plate the pyrometer was aimed"
  consistency_check_not_calibration: "CORRECTED 2026-08-19 after Kimi's review -- the original wording of this entry claimed the beam crosses the window centre at t = 0.6227 s, exactly equal to the measured peak. That was wrong: it confused 'the beam is ON the centre track' with 'the beam is AT the centre point'. Recomputed from the generator's own output: the beam is on the centre track (mesh y = 2.0 mm, the 42nd of 83) from t = 0.6192 to 0.6342 s and passes the window centre POINT (2, 2) mm at t = 0.62668 s. Balbaa's measured Fig 14 peak (1470 degC) is at t = 0.6227 s. The gap is 4.0 ms, against a track period of 15.09 ms -- so the two agree to within a third of a track period, not exactly"
  why_the_4ms_gap_is_expected: "the pyrometer spot is 2 mm across, so it covers three tracks at once (mesh y = 1.88 / 2.00 / 2.12 mm). The spot-AVERAGE temperature peaks when the accumulated heat under the spot is greatest, which need not be the instant the beam crosses the geometric centre; a peak in the inter-track segment after the 41st track and before the 42nd is entirely consistent. The check therefore still supports the convention at the track-period scale, which is the scale it can discriminate at -- it never had 0.6 ms resolving power, and claiming an exact match implied it did"
  what_would_falsify_it: "if the production as-is arm puts its spot-average temperature peak more than 2 track periods (2 x 15.09 = 30.2 ms) away from t = 0.6267 s, the centring or the start corner is wrong and this entry must be revisited before the gate is read"
  resolution_path: "DONE for the thermal gate. [50] (Balbaa 2019 IJAMT) was NOT acquired -- if it ever is, check the machine stripe setting against this convention"


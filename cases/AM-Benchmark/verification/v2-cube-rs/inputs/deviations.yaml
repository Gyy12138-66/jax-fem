  paper_says: "J-C rate coefficient C = 2.09e-4 at edot0 = 1670/s"
  status: resolved
  adopted: "omit the rate term, i.e. evaluate the modified J-C at the reference rate 1670/s; tabulate sigma(eps_p, T) into flow_curve.csv"
  justification: "QUANTIFIED 2026-07-30 (model/make_v2_mech_tables.py --quantify): the rate factor spans 0.99701 (1e-3 /s) to 1.00086 (1e5 /s) -- under 0.3 % across EIGHT decades of strain rate, because C is tiny and the reference rate sits mid-range. Two orders of magnitude below any RS acceptance criterion, so the omission is immaterial rather than merely convenient"


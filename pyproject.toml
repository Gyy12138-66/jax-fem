[build-system]
requires = ["hatchling==1.26.3", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "jax-fem"
version = "0.0.12"
requires-python = ">=3.10"
authors = [
  {name = "Tianju Xue", email = "cetxue@ust.hk"},
  {name = "Weipeng Xu", email = "wxuby@connect.ust.hk"}
]
description = "A GPU accelerated Finite element analysis package in JAX."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["JAX", "GPU", "Python", "Finite element analysis", "Differentiable programming"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3"
]

[project.optional-dependencies]
verification = [
  "jsonschema[format-nongpl]>=4.26,<5",
  "PyMuPDF==1.28.0",
]

[tool.setuptools]
packages = ["jax_fem"]

[tool.pytest.ini_options]
markers = [
    "solver: lane A fast-scan branch precond-optimization (flash acceleration) fast gate -- linear solver registry, pardiso, amg",
    "meltpool: lane B detail-scan branch meltpool-source (path-resolved / melt-pool) fast gate -- heat source, event table, V1 reduced regression",
    "gpu: requires a CUDA device",
    "slow: minutes or longer; excluded from lane fast gates",
]
